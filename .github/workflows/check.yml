name: Check Selfridges FRAGRANCE Advent Calendar

on:
  schedule:
    # Baseline: every 15 minutes, all the time
    - cron: "*/15 * * * *"
    # Tightened window: every 5 minutes, 28-30 September
    - cron: "*/5 * 28-30 9 *"
    # Tightened window: every 5 minutes, 1-5 October
    - cron: "*/5 * 1-5 10 *"
  workflow_dispatch: {}

jobs:
  check-fragrance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore last known state
        uses: actions/cache@v4
        with:
          path: fragrance_state.txt
          key: fragrance-state-${{ github.run_id }}
          restore-keys: |
            fragrance-state-

      - name: Run fragrance check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_fragrance.py

      - name: Save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: fragrance_state.txt
          key: fragrance-state-${{ github.run_id }}
